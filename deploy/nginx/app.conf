# FincoGPT nginx configuration
# Place in /etc/nginx/sites-available/finco-web.conf
# Then symlink: sudo ln -s /etc/nginx/sites-available/finco-web.conf /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ── SSL Configuration ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # Remove server header
    proxy_hide_header X-Powered-By;
    more_clear_headers Server;

    # ── Gzip Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/html text/javascript application/javascript application/json application/xml;

    # ── Client body size limit (max upload) ─────────────────────────
    client_max_body_size 10M;

    # ── Access/Error Logs ───────────────────────────────────────────
    access_log /var/log/nginx/finco-web.access.log;
    error_log  /var/log/nginx/finco-web.error.log;

    # ── Static Files ───────────────────────────────────────────────
    location /static/ {
        alias /opt/finco1/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── FincoGPT Web App (HTTPS → gunicorn on 127.0.0.1:8000) ───────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_redirect     off;

        # Timeouts
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}