{% if not valid %}
<div class="alert alert-error" style="margin-bottom:1rem;">
  <strong>Validation failed</strong> — please fix the following:
</div>
{% endif %}
{% for err in errors %}
<div class="alert alert-error">{{ err }}</div>
{% endfor %}
{% if valid %}
<div class="alert alert-info" style="margin-bottom:1rem;">
  ✓ All inputs look good — click <strong>Run Model</strong> when ready
</div>
{% endif %}
