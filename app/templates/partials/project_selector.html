<!-- Project Selector — Excel-like workspace sidebar — Phase 9.5 -->
<div class="project-selector" id="project-selector">
  <div class="ps-header">
    <div class="ps-label">Projects</div>
  </div>

  <div class="ps-list" id="ps-list">
    <!-- TUHO Wind -->
    <a href="/?project=tuho"
       class="ps-card {% if project_ctx.code == 'TUHO' %}active{% endif %}"
       id="ps-tuho" data-project="tuho">
      <div class="ps-card-icon">💨 Wind</div>
      <div class="ps-card-info">
        <div class="ps-card-name">TUHO Wind 1</div>
        <div class="ps-card-meta">35 MW · Croatia</div>
      </div>
      {% if project_ctx.code == 'TUHO' %}
      <div class="ps-card-status ps-card-status--active">●</div>
      {% else %}
      <div class="ps-card-status"></div>
      {% endif %}
    </a>

    <!-- Oborovo Solar -->
    <a href="/?project=oborovo"
       class="ps-card {% if project_ctx.code == 'OBOROVO' %}active{% endif %}"
       id="ps-oborovo" data-project="oborovo">
      <div class="ps-card-icon">☀ Solar</div>
      <div class="ps-card-info">
        <div class="ps-card-name">Oborovo Solar PV</div>
        <div class="ps-card-meta">75.26 MW · Croatia</div>
      </div>
      {% if project_ctx.code == 'OBOROVO' %}
      <div class="ps-card-status ps-card-status--active">●</div>
      {% else %}
      <div class="ps-card-status"></div>
      {% endif %}
    </a>
  </div>
</div>
