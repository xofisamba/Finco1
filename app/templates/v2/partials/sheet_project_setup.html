{#
  Workbook V2 — Project Setup sheet partial (read-only projection).

  This is a READ-ONLY view.  No <input> or <select> controls are rendered.
  Editing arrives in a subsequent PR once a V2 draft-update endpoint and
  round-trip persistence tests exist.

  Context variables (from app/v2/router.py _build_ps_fields):
    ps_fields : list of dicts, one per FieldSpec, ordered by section.order
                then field.order.  Each dict:
      field_id      str   — semantic ID ("project_setup.identity.project_name")
      label         str   — display label
      unit          str|None
      field_type    str   — FieldType.value ("text","date","select","float",…)
      binding_label str   — "bound"|"partial"|"display-only"|"template-locked"
      options       list  — non-empty for SELECT fields
      section_id    str   — "identity"|"technical"
      section_label str
      value         any   — typed value from ProjectInputSet (or None)

  Values always come from pis.get(field_id).  Snapshot keys never appear here.

  binding_label drives the annotation badge:
    bound           will be editable once save endpoint exists
    partial         not yet fully connected to engine
    display-only    derived/computed; never user-editable
    template-locked frozen at project creation
#}

{%- macro _display_value(f) -%}
  {%- if f.value is none or f.value == "" -%}
    <span class="v2-field-empty">—</span>
  {%- elif f.field_type == "date" -%}
    {{ f.value | string }}
  {%- elif f.field_type == "bool" -%}
    {{ "Yes" if f.value else "No" }}
  {%- elif f.field_type in ("float","mw","mwh","keur","pct","bps") -%}
    {{ f.value }}{% if f.unit %} <span class="v2-field-unit">{{ f.unit }}</span>{% endif %}
  {%- elif f.field_type in ("int","years","months") -%}
    {{ f.value }}{% if f.unit %} <span class="v2-field-unit">{{ f.unit }}</span>{% endif %}
  {%- else -%}
    {{ f.value }}
  {%- endif -%}
{%- endmacro -%}

<div id="v2-sheet-project-setup" data-sheet="project_setup">

  {% set ns = namespace(current_section=None) %}
  {% for f in ps_fields %}

    {% if f.section_id != ns.current_section %}
      {% if ns.current_section is not none %}
        </div>{# close section-fields #}
      </div>{# close section #}
      {% endif %}
      <div class="v2-section" data-section="{{ f.section_id }}">
        <h3 class="v2-section-label">{{ f.section_label }}</h3>
        <div class="v2-section-fields">
      {% set ns.current_section = f.section_id %}
    {% endif %}

    <div class="v2-field-row v2-field-readonly"
         data-field-id="{{ f.field_id }}"
         data-binding="{{ f.binding_label }}"
         data-field-type="{{ f.field_type }}">
      <span class="v2-field-label">
        {{ f.label }}{% if f.unit %} <span class="v2-field-unit">({{ f.unit }})</span>{% endif %}
      </span>
      <span class="v2-field-value" data-field-id="{{ f.field_id }}">
        {{ _display_value(f) }}
      </span>
      <span class="v2-binding-badge v2-binding-{{ f.binding_label }}"
            title="{{ f.binding_label }}">{{ f.binding_label }}</span>
    </div>

  {% endfor %}

  {% if ns.current_section is not none %}
    </div>{# close section-fields #}
  </div>{# close last section #}
  {% endif %}

</div>{# v2-sheet-project-setup #}
