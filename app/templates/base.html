<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FincoGPT — Internal Advisory Platform{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a56db'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-weight='700' fill='white'>F</text></svg>" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>

<!-- Fixed top header -->
<header class="top-header">
  <div class="header-inner">
    <div class="header-brand">
      <span class="brand-logo">F</span>
      <div class="brand-text">
        <span class="brand-name">FincoGPT</span>
        <span class="brand-sub">Internal Advisory Platform</span>
      </div>
    </div>
    <div class="header-right">
      <span class="env-badge">INTERNAL DEMO</span>
      <span class="version-badge">v1.7 Private Pilot</span>
      {% if user %}
      <form method="POST" action="/logout" style="display:inline;">
        <button type="submit" class="logout-btn">Sign out</button>
      </form>
      {% endif %}
    </div>
  </div>
</header>

<!-- Page content — override in child templates -->
{% block body %}{% endblock %}

<script>
  // Global HTMX loading indicator
  document.body.addEventListener('htmx:beforeRequest', function(e) {
    if (e.detail.target) e.detail.target.classList.add('htmx-loading');
  });
  document.body.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.target) e.detail.target.classList.remove('htmx-loading');
  });
</script>

</body>
</html>
