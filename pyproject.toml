[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finco1"
version = "0.1.0"
description = "Finco1 financial modelling application"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pandas",
    "openpyxl",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_"]
addopts = "-q --tb=short"