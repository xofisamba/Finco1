name: CI

on:
  push:
    branches: [main, industry-engine-refactor]
  pull_request:
    branches: [main, industry-engine-refactor]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (reproducible via constraints.txt)
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest
      - name: Run tests
        run: |
          python3 -m pytest -q --tb=short \
            tests/test_phase23c_shl_distribution_lockup_review_frozen_schedule.py \
            tests/test_phase23a_frozen_excel_senior_debt_schedule_runtime_wiring.py \
            tests/test_shl_waterfall_priority.py \
            tests/test_tuho_shl_calibration.py \
            tests/test_revenue.py \
            tests/test_opex.py
