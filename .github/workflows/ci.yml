name: CI

on:
  push:
    branches: [main, industry-engine-refactor]
  pull_request:
    branches: [main, industry-engine-refactor]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest python-dateutil
      - name: Run tests
        run: pytest --tb=short -q
