name: C3B3D2B6 - Base Performance + Post-Senior Cash Parity Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c3b3d2b6-base-post-senior-cash-parity-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  c3b3d2b6-base-post-senior-cash-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY"
          echo "All changed files are in UI/template/presentation paths."
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Verify exact PR head
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify base ancestry
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          git merge-base --is-ancestor c64100c3257fcaee0ab5cffdeeb3a0b7c5ce58c2 HEAD

      - name: Setup Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dateutil numpy scipy openpyxl itsdangerous

      - name: Diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: git diff --check

      - name: B6 focused suite
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py

      - name: B5 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py

      - name: B4 / B4.2 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b4_dscr_post_senior_cash_authority.py

      - name: B3 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b3_debt_sizing_case_production.py

      - name: C3B3A regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_stage_c3b3a_clean_senior_debt_source_contract.py

      - name: C3B1 / C3A period-axis regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            tests/test_stage_c3a_clean_pnl_through_ebit.py \
            tests/test_period_engine.py \
            tests/test_period_day_fractions.py

      - name: Phase 2C relevant generic/TUHO regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_phase2c_senior_debt.py::TestO_ThreeRunnableBaselines::test_runnable_baseline_produces_senior_debt \
            tests/test_phase2c_senior_debt.py::TestO_ThreeRunnableBaselines::test_runnable_baseline_tax_cfads_uses_final_senior_interest \
            tests/test_phase2c_senior_debt.py::TestFinalTaxCfads::test_final_tax_reflects_senior_interest

      - name: TUHO anti-overfit
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/integration/test_tuho_wind1_fixture.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py::test_tuho_subject_to_limitations_fails_closed_in_clean_fixed_point_path

      - name: Governance scan
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          ! grep -RInE "approved_delta|expected_delta|target fitting|source-vector runtime input|335\\.8700119281534" \
            financial_engine finco_core \
            --exclude-dir='__pycache__'
