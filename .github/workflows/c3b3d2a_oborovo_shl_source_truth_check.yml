name: C3B3D2A Oborovo SHL Source Truth Check

on:
  pull_request:
    branches: [main]
    paths:
      - tests/fixtures/excel_oborovo_shl_operating_truth.json
      - tests/test_stage_c3b3d2a_oborovo_shl_source_truth.py
      - financial_engine/adapters/tax_inputs.py
      - app/project_factories.py
      - docs/reconciliation/c3b3d2a_oborovo_shl_source_truth.md
      - .github/workflows/c3b3d2a_oborovo_shl_source_truth_check.yml
  push:
    branches:
      - stage-c3b3d2a-oborovo-shl-source-truth
    paths:
      - tests/fixtures/excel_oborovo_shl_operating_truth.json
      - tests/test_stage_c3b3d2a_oborovo_shl_source_truth.py
      - financial_engine/adapters/tax_inputs.py
      - app/project_factories.py
      - docs/reconciliation/c3b3d2a_oborovo_shl_source_truth.md
      - .github/workflows/c3b3d2a_oborovo_shl_source_truth_check.yml

jobs:
  c3b3d2a-check:
    name: C3B3D2A Oborovo SHL source truth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: HEAD mismatch. Expected=$EXPECTED Actual=$ACTUAL"
            exit 1
          fi
          echo "SHA verified: ${ACTUAL}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -c constraints.txt \
            pytest openpyxl numpy pandas scipy itsdangerous bcrypt

      - name: git diff --check
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD

      - name: C3B3D2A source-truth fixture coherence
        run: |
          python -m pytest \
            tests/test_stage_c3b3d2a_oborovo_shl_source_truth.py \
            -v --tb=short --no-header

      - name: C3B3D1 regression — canonical SHL schedule
        run: |
          python -m pytest \
            tests/test_stage_c3b3d1_canonical_shl_schedule.py \
            -v --tb=short --no-header -q

      - name: C3B3C regression — tax policy contract
        run: |
          python -m pytest \
            tests/test_stage_c3b3c_tax_policy_shl_deductibility.py \
            tests/test_stage_c3b3c_legacy_runtime_safety.py \
            -v --tb=short --no-header -q

      - name: Phase2B TUHO regression — MUST be green
        run: |
          python -m pytest \
            "tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[tuho]" \
            "tests/test_phase2b_tax_cfads.py::TestTuhoConstructionLoss::test_tuho_end_to_end_exact_matcher" \
            -v --tb=short --no-header
