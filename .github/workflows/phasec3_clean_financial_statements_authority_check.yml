name: Phase C3 - Clean Financial Statements Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  clean-financial-statements-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "C3_HEAD_SHA_MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          }

      - name: Assert ancestry from C2 main
        run: |
          BASE="c5d91ddf7e83dfa3d6da2e0a68e1b1caa7c98d65"
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "C3_BASE_ANCESTRY_MISSING: $BASE is not an ancestor of HEAD"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Whitespace and diff hygiene
        run: |
          git diff --check
          git status --short

      - name: Production-governance scan of changed Python files
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only c5d91ddf7e83dfa3d6da2e0a68e1b1caa7c98d65...HEAD -- app domain financial_engine finco_core \
              | grep -E '\.py$' || true
          )
          if ((${#changed_python[@]})); then
            ! grep -nHEi \
              'approved_delta|expected_delta|balancing[_ ]plug|terminal[_ -]top[- ]up|forced principal|target fitting|post-engine mutation|bank_balancing_cost|WaterfallRunner' \
              "${changed_python[@]}"
          fi

      - name: C3 focused acceptance suite
        run: |
          python -m pytest -q \
            tests/test_phasec3_clean_financial_statements_authority.py

      - name: B4 legacy-excision governance (statement path inherits clean-only)
        run: |
          python -m pytest -q \
            tests/test_phaseb4_single_production_engine.py

      - name: C2 / C1 freeze authorities
        run: |
          python -m pytest -q \
            tests/test_phasec2_npv_llcr_plcr_authority.py \
            tests/test_phasec1_returns_maturity_authority.py

      - name: G0 / G2C / G2B regressions
        run: |
          python -m pytest -q \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py

      - name: PR-8 single-authority + PR-7 + PR-6 regressions
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr8_single_production_financial_authority.py \
            tests/test_prefreeze_pr7_typed_base_bank_case_authority.py \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py

      - name: Book/tax depreciation + SHL/DSRA authorities
        run: |
          python -m pytest -q \
            tests/test_book_depreciation_pnl_bridge.py \
            tests/test_pr3_cash_dsra_module.py \
            tests/test_pr3b_dynamic_dsra_target.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py

      - name: Tax authority + C3B1 + KUPI
        run: |
          python -m pytest -q \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            tests/test_kupi_k0_k3_causal_grid.py
