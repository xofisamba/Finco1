name: Pre-freeze PR-5 - Canonical EBITDA Authority

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONUTF8: "1"

concurrency:
  group: prefreeze-pr5-canonical-ebitda-authority-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  canonical-ebitda-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: git diff --check

      - name: PR-5 focused authority suite
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: python -m pytest -q tests/test_prefreeze_pr5_canonical_ebitda_authority.py

      - name: Historical cross-arc guardrails
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_phase57a8_capex_add_line_ux_in_memory.py \
            tests/test_phase57a9d_capex_sub_lines_run_integration.py

      - name: Frozen downstream authority regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_pr3_cash_dsra_module.py \
            tests/test_pr3b_dynamic_dsra_target.py \
            tests/test_pr4_reserve_gated_sponsor_shl.py \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g1_governance_methodology_lock.py \
            tests/test_mvp_g2a_financing_stack.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py \
            tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py \
            tests/test_stage_c3b3d2b7_bank_case_senior_parity.py \
            tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py \
            tests/test_kupi_k0_k3_causal_grid.py

      - name: Added-line governance scan
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || '84117df4443bcc5a09d0c5db733115f9b34dacd0' }}"
          git diff --unified=0 "$BASE"...HEAD -- \
            app domain financial_engine finco_core \
            | grep '^+' \
            | grep -v '^+++' \
            > /tmp/pr5_added_lines.txt || true
          if grep -Ein \
            'project\.name|project\.code|baseline_id|approved_delta|expected_delta|balancing[_ ]plug|target fitting|hardcoded EBITDA|source replay' \
            /tmp/pr5_added_lines.txt; then
            echo "PR5_GOVERNANCE_VIOLATION"
            exit 1
          fi
          echo "PR5_ADDED_LINES_GOVERNANCE_CLEAN"
