name: MVP G0 - Generic Clean Engine Enablement Check

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "finco_core/**"
      - "domain/**"
      - "app/api/project_runner.py"
      - "app/services/production_financial_authority.py"
      - "app/services/production_waterfall_seam.py"
      - "app/project_factories.py"
      - "constraints.txt"
      - "tests/test_mvp_g0_generic_clean_engine_enablement.py"
      - ".github/workflows/mvp_g0_generic_clean_engine_check.yml"
  workflow_dispatch:

concurrency:
  group: mvp-g0-generic-clean-engine-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  mvp-g0-generic-clean-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Verify exact PR head
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify MVP-G0 base ancestry
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          git merge-base --is-ancestor 08f12a1516173efaab7d2569022a24b101b03976 HEAD

      - name: Setup Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dateutil numpy scipy openpyxl itsdangerous

      - name: Diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: git diff --check

      - name: Generic Solar/Wind clean E2E and causal tests
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_mvp_g0_generic_clean_engine_enablement.py

      - name: Generic clean tax ownership serialization
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_stage_c3b3b_clean_tax_cfads_debt_feedback.py::TestGroupJ_SerializationRoundtrip \
            tests/test_stage_c3b3b_clean_tax_cfads_debt_feedback.py::TestGroupK_CashTaxTimingOwnership

      - name: B8 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py

      - name: B7 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b7_bank_case_senior_parity.py

      - name: B6 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py

      - name: B5 regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py

      - name: TUHO fail-closed anti-overfit
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/integration/test_tuho_wind1_fixture.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py::test_tuho_subject_to_limitations_fails_closed_in_clean_fixed_point_path

      - name: Oborovo debt checkpoint
        if: steps.scope.outputs.engine_sensitive == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q \
            tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py::test_senior_schedule_remains_source_close_and_debt_quantum_authoritative

      - name: Governance scan
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          changed_python_diff="$(
            git diff --unified=0 \
              08f12a1516173efaab7d2569022a24b101b03976...HEAD \
              -- financial_engine finco_core app domain \
            | grep -E '^\+[^+]' || true
          )"

          if [[ -n "$changed_python_diff" ]]; then
            ! grep -nE \
              "approved_delta|expected_delta|target debt fitting|target cfads fitting|target tax fitting|target shl fitting|source output vector runtime input|magic 42852|magic ds1|post-engine mutation|project\.name|project\.code|baseline_id|balancing plug" \
              <<< "$changed_python_diff"
          fi
