name: Pre-freeze PR-9 Typed Construction IDC Authority Check

on:
  push:
    branches:
      - prefreeze-pr9-typed-construction-idc-authority
      - claude/**
  pull_request:
    branches:
      - main
    paths:
      - "finco_core/construction/stage_b2.py"
      - "finco_core/inputs/construction_financing.py"
      - "finco_core/inputs/_models.py"
      - "finco_core/inputs/__init__.py"
      - "financial_engine/construction/**"
      - "financial_engine/financing/contracts.py"
      - "financial_engine/financing/project.py"
      - "tests/test_pr9_typed_construction_idc_authority.py"
      - "tests/test_stage_b2_construction_idc_runtime.py"
      - "tests/test_oborovo_stageb2_source_parity.py"
      - ".github/workflows/prefreeze_pr9_typed_construction_idc_authority_check.yml"

jobs:
  pr9-typed-construction-idc-authority:
    name: PR-9 Typed Construction IDC Authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: HEAD SHA mismatch — not running on the exact PR head commit"
            exit 1
          fi

      - name: Assert ancestry from PR-8 freeze commit
        run: |
          ANCESTOR="9b37ecc1d5d0d925f51f6716f7f0a9374aa1580e"
          if ! git merge-base --is-ancestor "$ANCESTOR" HEAD; then
            echo "ERROR: HEAD is not a descendant of PR-8 freeze commit $ANCESTOR"
            exit 1
          fi
          echo "OK: HEAD descends from $ANCESTOR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
            pip install -c constraints.txt pytest
          else
            pip install -e .
            pip install pytest
          fi

      - name: git diff --check (no trailing whitespace)
        run: |
          git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD

      - name: Run PR-9 typed construction IDC authority tests
        run: |
          python -m pytest tests/test_pr9_typed_construction_idc_authority.py \
            -v --tb=short --no-header

      - name: Run canonical Stage B2 tests (backward compat)
        run: |
          python -m pytest tests/test_stage_b2_construction_idc_runtime.py \
            -v --tb=short --no-header

      - name: Run Oborovo source parity tests
        run: |
          python -m pytest tests/test_oborovo_stageb2_source_parity.py \
            -v --tb=short --no-header

      - name: Run Oborovo parity and debt service tests
        run: |
          python -m pytest \
            tests/test_oborovo_parity.py \
            tests/test_oborovo_debt_service.py \
            -v --tb=short --no-header

      - name: Run existing stage B2 and construction tests
        run: |
          python -m pytest \
            tests/test_stage_b2_construction_idc_runtime.py \
            tests/test_oborovo_stageb2_source_parity.py \
            tests/test_oborovo_dscr_calibration.py \
            -v --tb=short --no-header
