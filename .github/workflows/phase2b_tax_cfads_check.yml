name: Phase 2B Tax and CFADS Check

# Phase 2B — Policy-driven tax, vintage FIFO LCF, and canonical CFADS.
#
# Gate order (all 13 steps must pass):
#   1.  Checkout exact head
#   2.  Resolve comparison base SHA
#   3.  Constraint-based install (numpy==1.26.4, pandas==2.2.3)
#   4.  Baseline snapshot diff (must be unchanged from merge-base)
#   5.  Protected production scope diff (must be unchanged from merge-base)
#   6.  Phase 2B unit tests (A–J+, TestAA exact correction matcher)
#   7.  Phase 2A regression suite
#   8.  generate_baselines --check (baseline integrity; covers freshness in memory)
#   9.  [No-op: --check already validates snapshot freshness; no --regen CLI arg exists]
#   10. OPERATING_CORE_V1 --all --check (Phase 2A regression gate)
#   11. Approved-ledger hard validation via load_and_validate_ledger (exit 1 on any error)
#   12. TAX_CFADS_V1 diagnostic comparison with --allow-input-source-blocked (report only)
#   13. TAX_CFADS_V1 --check: zero-unexplained + zero-input-source-blocked (exit 9 while TUHO unresolved)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase2b-tax-cfads:
    name: Phase 2B Tax and CFADS (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ── Step 2: Resolve comparison base SHA ─────────────────────────────────
      - name: Resolve comparison base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparison base: $BASE_SHA"

      # ── Step 3: Install dependencies (constraint-based) ─────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -c constraints.txt numpy==1.26.4 pandas==2.2.3
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      # ── Step 4: Baseline snapshots unchanged ────────────────────────────────
      - name: Check baseline snapshots unchanged
        run: |
          CHANGED=$(git diff --name-only "${{ steps.base.outputs.base_sha }}"...HEAD \
            -- finco_parity/baselines/snapshots/)
          if [ -n "$CHANGED" ]; then
            echo "ERROR: Phase 2B must not modify baseline snapshots:"
            echo "$CHANGED"
            exit 1
          fi
          echo "Baseline snapshots: unchanged"

      # ── Step 5: Protected production scope (narrow governance) ────────────────────────
      - name: Check protected production scope (narrow governance)
        run: |
          BASE="${{ steps.base.outputs.base_sha }}"
          python3 .github/scripts/check_protected_scope.py "$BASE" HEAD

      # ── Step 6: Phase 2B test suite ────────────────────────────────────────
      - name: Phase 2B test suite (tests A–J+)
        run: |
          python -m pytest tests/test_phase2b_tax_cfads.py -v --tb=short

      # ── Step 7: Phase 2A regression suite ──────────────────────────────────
      - name: Phase 2A regression suite
        run: |
          python -m pytest \
            tests/test_phase2a_engine_inputs.py \
            tests/test_phase2a_orchestrator.py \
            tests/test_phase2a_production_isolation.py \
            -v --tb=short

      # ── Step 8: Phase 1A–1C generate_baselines integrity check ─────────────
      - name: Phase 1A–1C generate_baselines integrity check
        run: |
          python -m finco_parity.generate_baselines --check

      # ── Step 9: Phase 1A–1C generate_baselines --check already covers freshness ─
      # --check regenerates snapshots in memory and compares against committed
      # artifacts without writing any files, so no separate --regen step is needed.
      - name: Phase 1A–1C generate_baselines freshness (covered by step 8 --check)
        run: |
          echo "Step 8 --check already validates snapshot freshness — no separate regen step needed."

      # ── Step 10: Phase 2A OPERATING_CORE_V1 parity ─────────────────────────
      - name: Phase 2A OPERATING_CORE_V1 parity (regression gate)
        run: |
          python -m finco_parity.check_financial_engine_operating_core --all --check

      # ── Step 11: Approved-ledger hard validation ──────────────────────────────
      # Missing ledger is a hard failure (exit 1). No skip-if-missing path.
      - name: Approved-ledger hard validation (load_and_validate_ledger)
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          from finco_parity.correction_matcher import (
              LedgerValidationError,
              load_and_validate_ledger,
          )

          approved_path = Path("finco_parity/corrections/tax_cfads_v1_exact.json")
          # Missing ledger is a hard failure — no skip.
          try:
              ledger = load_and_validate_ledger(approved_path)
          except FileNotFoundError as exc:
              print(f"GOVERNANCE FAILURE: mandatory approved ledger not found: {exc}")
              sys.exit(1)
          except LedgerValidationError as exc:
              print(str(exc))
              sys.exit(1)

          n = sum(len(v) for v in ledger.values())
          print(f"Approved ledger: {n} records valid across {len(ledger)} baseline(s)")
          EOF

      # ── Step 12: Phase 2B TAX_CFADS_V1 diagnostic comparison ─────────────────
      # Diagnostic run: reports all three runnable baselines; TUHO shown as blocked.
      # Uses --allow-input-source-blocked so this step passes while TUHO is unresolved.
      # Step 13 applies the blocking assertion.
      - name: Phase 2B TAX_CFADS_V1 correction-aware comparison (diagnostic)
        run: |
          mkdir -p "${RUNNER_TEMP}/phase2b"
          python -m finco_parity.check_financial_engine_tax_cfads --all \
            --allow-input-source-blocked \
            --text-report "${RUNNER_TEMP}/phase2b/tax_cfads_v1_parity.txt"

      # ── Step 13: Zero-input-source-blocked assertion ───────────────────────
      # Exit 9 if any baseline is INPUT_SOURCE_BLOCKED (TUHO opening-loss unresolved).
      # --allow-input-source-blocked is NOT used here — this step is intentionally
      # blocking until all input sources are resolved.
      - name: Zero input-source-blocked assertion
        run: |
          python -m finco_parity.check_financial_engine_tax_cfads --all --check \
            --text-report "${RUNNER_TEMP}/phase2b/tax_cfads_v1_parity_check.txt"
          # Exit 9 means INPUT_SOURCE_BLOCKED; exit 3 means UNEXPLAINED_DRIFT.
          # Both are failures. The command above exits non-zero on either.
          echo "All baselines runnable and clean."
