name: Phase 2B Tax and CFADS Check

# Phase 2B — Policy-driven tax, vintage FIFO LCF, and canonical CFADS.
#
# Gate order (all must pass):
#   1. Baseline snapshots unchanged
#   2. Protected production scope unchanged
#   3. Phase 2B unit tests (tests A–J)
#   4. Phase 2A regression suite
#   5. Phase 1A–1C generate_baselines --check (integrity of baseline data)
#   6. Phase 2A OPERATING_CORE_V1 parity (regression gate)
#   7. Phase 2B TAX_CFADS_V1 parity (all four baselines)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase2b-tax-cfads:
    name: Phase 2B Tax and CFADS (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve comparison base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparison base: $BASE_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Check baseline snapshots unchanged
        run: |
          CHANGED=$(git diff --name-only ${{ steps.base.outputs.base_sha }} HEAD \
            -- finco_parity/baselines/snapshots/ 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "ERROR: Phase 2B must not modify baseline snapshots:"
            echo "$CHANGED"
            exit 1
          fi
          echo "Baseline snapshots: unchanged"

      - name: Check protected production scope unchanged
        run: |
          CHANGED=$(git diff --name-only ${{ steps.base.outputs.base_sha }} HEAD \
            -- app/ domain/ main_web.py main_api.py finco_core/waterfall/ 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "ERROR: Phase 2B must not modify protected production files:"
            echo "$CHANGED"
            exit 1
          fi
          echo "Protected production scope: unchanged"

      - name: Phase 2B test suite (tests A–J)
        run: |
          python -m pytest tests/test_phase2b_tax_cfads.py -v --tb=short

      - name: Phase 2A regression suite
        run: |
          python -m pytest \
            tests/test_phase2a_engine_inputs.py \
            tests/test_phase2a_orchestrator.py \
            tests/test_phase2a_production_isolation.py \
            -v --tb=short

      - name: Phase 1A–1C generate_baselines integrity check
        run: |
          python -m finco_parity.generate_baselines --check

      - name: Phase 2A OPERATING_CORE_V1 parity (regression gate)
        run: |
          python -m finco_parity.check_financial_engine_operating_core --all --check

      - name: Phase 2B TAX_CFADS_V1 parity (all four baselines, blocking)
        run: |
          # Correction-aware check: IDENTICAL and APPROVED_FINANCIAL_CORRECTION → exit 0.
          # UNEXPLAINED_DRIFT → exit 3 (blocks the build).
          # The approved corrections are recorded in finco_parity/corrections/tax_cfads_v1_exact.json.
          # Regenerate with: python -m finco_parity.generate_tax_cfads_corrections
          python -m finco_parity.check_financial_engine_tax_cfads --all \
            --text-report reports/phase2b_tax_cfads/tax_cfads_v1_parity.txt
