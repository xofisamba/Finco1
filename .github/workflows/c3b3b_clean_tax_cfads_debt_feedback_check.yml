name: C3B3B Clean Tax CFADS Debt Feedback Check

on:
  pull_request:
    branches: [main]
    paths:
      - financial_engine/tax/**
      - financial_engine/cfads/**
      - financial_engine/senior_debt/**
      - financial_engine/adapters/**
      - financial_engine/orchestrator.py
      - financial_engine/provenance.py
      - app/project_factories.py
      - finco_core/inputs/**
      - tests/test_stage_c3b3b_*.py
      - tests/test_stage_c3b3a_*.py
      - tests/test_stage_c3b2_*.py
      - tests/test_stage_c3b1_*.py
      - tests/test_phase2b_*.py
      - tests/test_phase2c_senior_debt.py
      - .github/workflows/c3b3b_clean_tax_cfads_debt_feedback_check.yml
  push:
    branches:
      - stage-c3b3b-clean-tax-cfads-debt-feedback
    paths:
      - financial_engine/tax/**
      - financial_engine/cfads/**
      - financial_engine/senior_debt/**
      - financial_engine/adapters/**
      - financial_engine/orchestrator.py
      - financial_engine/provenance.py
      - app/project_factories.py
      - finco_core/inputs/**
      - tests/test_stage_c3b3b_*.py
      - tests/test_stage_c3b3a_*.py
      - tests/test_stage_c3b2_*.py
      - tests/test_stage_c3b1_*.py
      - tests/test_phase2b_*.py
      - tests/test_phase2c_senior_debt.py
      - .github/workflows/c3b3b_clean_tax_cfads_debt_feedback_check.yml

jobs:
  c3b3b-check:
    name: C3B3B clean tax/CFADS/debt feedback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: HEAD mismatch. Expected=$EXPECTED Actual=$ACTUAL"
            exit 1
          fi
          echo "SHA verified: ${ACTUAL}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt 2>/dev/null \
            || pip install -r requirements.txt

      - name: git diff --check
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD

      - name: C3B3B clean tax/CFADS/debt feedback tests (explicit)
        run: |
          python -m pytest \
            tests/test_stage_c3b3b_clean_tax_cfads_debt_feedback.py \
            -v --tb=short --no-header

      - name: C3B3A regression (126 tests)
        run: |
          python -m pytest \
            tests/test_stage_c3b3a_clean_senior_debt_source_contract.py \
            -v --tb=short --no-header -q

      - name: C3B2 regression (185 tests)
        run: |
          python -m pytest \
            tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py \
            -v --tb=short --no-header -q

      - name: C3B1 source truth (full module)
        run: |
          python -m pytest \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            -v --tb=short --no-header -q

      - name: Phase2B TUHO regression — MUST be green (C3B3B2 branch-induced fix)
        run: |
          python -m pytest \
            "tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[tuho]" \
            "tests/test_phase2b_tax_cfads.py::TestTuhoConstructionLoss::test_tuho_end_to_end_exact_matcher" \
            -v --tb=short --no-header

      - name: Phase2B all tests except known pre-existing Oborovo baseline failure
        run: |
          python -m pytest \
            tests/test_phase2b_tax_cfads.py \
            --deselect "tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[oborovo]" \
            -v --tb=short --no-header -q

      - name: Phase2C senior debt tests (explicit)
        run: |
          python -m pytest \
            tests/test_phase2c_senior_debt.py \
            -v --tb=short --no-header -q
