name: Phase B4 - Single Production Engine / Legacy Excision

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "finco_core/**"
      - "domain/**"
      - "app/api/**"
      - "app/services/**"
      - "app/persistence/**"
      - "app/workbook/**"
      - "app/project_factories.py"
      - "constraints.txt"
      - "tests/test_phaseb4_single_production_engine.py"
      - ".github/workflows/phaseb4_single_production_engine_check.yml"
  push:
    branches: [main]

concurrency:
  group: phaseb4-single-production-engine-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  single-production-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "B4_HEAD_SHA_MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          }

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Assert ancestry from B3 main
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          BASE="bf71b21dfe1130a100454bbc5d6faa2c9db4e549"
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "B4_BASE_ANCESTRY_MISSING: $BASE is not an ancestor of HEAD"
            exit 1
          }

      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Whitespace and diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          git diff --check
          git status --short

      - name: B4 focused acceptance (A-G + governance gate)
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q tests/test_phaseb4_single_production_engine.py

      - name: B1/B2/B3 regression rings
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_phaseb1_clean_only_production_router.py \
            tests/test_phaseb2_oborovo_clean_production_promotion.py \
            tests/test_phaseb3_tuho_clean_production_acceptance.py \
            tests/test_phaseb3_tuho_clean_production_promotion_blocker.py

      - name: PR-8 single-authority regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr8_single_production_financial_authority.py

      - name: PR-6 / PR-7 regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py \
            tests/test_prefreeze_pr7_typed_base_bank_case_authority.py

      - name: G0 / G2B / G2C authority regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py

      - name: Canonical period-axis checks
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_prf1_canonical_period_axis.py

      - name: Oborovo / TUHO source-evidence tests
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            tests/test_kupi_k0_k3_causal_grid.py
