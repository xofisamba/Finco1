name: Phase C1 - Decision Complete Returns and Maturity

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "finco_core/**"
      - "domain/**"
      - "app/api/project_runner.py"
      - "app/services/production_financial_authority.py"
      - "app/services/production_waterfall_seam.py"
      - "app/project_factories.py"
      - "constraints.txt"
      - "tests/test_phasec1_returns_maturity_authority.py"
      - ".github/workflows/phasec1_returns_maturity_check.yml"
  push:
    branches: [main]

concurrency:
  group: phasec1-returns-maturity-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  decision-complete-returns-maturity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "C1_HEAD_SHA_MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          }

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Assert B4 ancestry
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          BASE="def823200a856cb51eb247efe4871b541c5d6c3e"
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "C1_B4_BASE_ANCESTRY_MISSING: $BASE is not an ancestor of HEAD"
            exit 1
          }

      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: git diff --check

      - name: C1 focused acceptance
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: python -m pytest -q tests/test_phasec1_returns_maturity_authority.py

      - name: Sponsor and shareholder waterfall regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py

      - name: B4 production authority gate
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: python -m pytest -q tests/test_phaseb4_single_production_engine.py

      - name: High-risk financing and source-evidence ring
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py \
            tests/test_prefreeze_pr7_typed_base_bank_case_authority.py \
            tests/test_prefreeze_pr8_single_production_financial_authority.py \
            tests/test_phaseb3_tuho_clean_production_acceptance.py \
            tests/test_phaseb2_oborovo_clean_production_promotion.py \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            tests/test_kupi_k0_k3_causal_grid.py

      - name: Governance scan on C1 changed production files
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only def823200a856cb51eb247efe4871b541c5d6c3e...HEAD \
              -- financial_engine app domain finco_core \
              | grep -E '\.py$' || true
          )
          if ((${#files[@]})); then
            ! grep -nHE \
              'approved_delta|expected_delta|target fitting|source output vector runtime input|terminal top-up|project\.name|project\.code|baseline_id' \
              "${files[@]}"
          fi
