name: C3B3C Tax Policy Contract Check

on:
  pull_request:
    branches: [main]
    paths:
      - finco_core/waterfall/tax_engine.py
      - finco_core/waterfall/waterfall_engine.py
      - finco_core/inputs/_models.py
      - finco_core/inputs/serialization.py
      - app/project_factories.py
      - tests/test_stage_c3b3c_*.py
      - tests/test_stage_c3b3b_*.py
      - tests/test_stage_c3b3a_*.py
      - tests/test_stage_c3b2_*.py
      - tests/test_stage_c3b1_*.py
      - .github/workflows/c3b3c_tax_policy_contract_check.yml
  push:
    branches:
      - stage-c3b3c-tax-policy-shl-deductibility
    paths:
      - finco_core/waterfall/tax_engine.py
      - finco_core/waterfall/waterfall_engine.py
      - finco_core/inputs/_models.py
      - finco_core/inputs/serialization.py
      - app/project_factories.py
      - tests/test_stage_c3b3c_*.py
      - tests/test_stage_c3b3b_*.py
      - tests/test_stage_c3b3a_*.py
      - tests/test_stage_c3b2_*.py
      - tests/test_stage_c3b1_*.py
      - .github/workflows/c3b3c_tax_policy_contract_check.yml

jobs:
  c3b3c-check:
    name: C3B3C tax policy contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: HEAD mismatch. Expected=$EXPECTED Actual=$ACTUAL"
            exit 1
          fi
          echo "SHA verified: ${ACTUAL}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -c constraints.txt \
            pytest openpyxl numpy pandas scipy itsdangerous bcrypt

      - name: git diff --check
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD

      - name: C3B3C contract tests — typed SHL tax-policy schema
        run: |
          python -m pytest \
            tests/test_stage_c3b3c_tax_policy_shl_deductibility.py \
            -v --tb=short --no-header

      - name: C3B3C legacy runtime safety — TUHO + Oborovo production path
        run: |
          python -m pytest \
            tests/test_stage_c3b3c_legacy_runtime_safety.py \
            -v --tb=short --no-header

      - name: Serialization round-trip — SHL deductibility fields
        run: |
          python -m pytest \
            tests/test_v3_7_save_load_wiring.py::TestSaveProjectFullInputs::test_full_inputs_round_trip_tuho \
            tests/test_v3_7_save_load_wiring.py::TestSaveProjectFullInputs::test_full_inputs_round_trip_oborovo \
            -v --tb=short --no-header

      - name: C3B3B regression — clean tax/CFADS/debt feedback
        run: |
          python -m pytest \
            tests/test_stage_c3b3b_clean_tax_cfads_debt_feedback.py \
            -v --tb=short --no-header -q

      - name: C3B3A regression — clean senior debt source contract
        run: |
          python -m pytest \
            tests/test_stage_c3b3a_clean_senior_debt_source_contract.py \
            -v --tb=short --no-header -q

      - name: C3B2 regression — Oborovo debt interest source closure
        run: |
          python -m pytest \
            tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py \
            -v --tb=short --no-header -q

      - name: C3B1 governance — Oborovo tax source truth
        run: |
          python -m pytest \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            -v --tb=short --no-header -q

      - name: Phase2B TUHO regression — MUST be green
        run: |
          python -m pytest \
            "tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[tuho]" \
            "tests/test_phase2b_tax_cfads.py::TestTuhoConstructionLoss::test_tuho_end_to_end_exact_matcher" \
            -v --tb=short --no-header

      - name: Phase2B all tests except known pre-existing Oborovo baseline failure
        run: |
          python -m pytest \
            tests/test_phase2b_tax_cfads.py \
            --deselect "tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[oborovo]" \
            -v --tb=short --no-header -q
