name: C3B1 Oborovo Tax Source Truth

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - stage-c3b1-oborovo-tax-source-truth

jobs:
  c3b1-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: checked-out commit does not match expected head SHA" >&2
            exit 1
          fi
          echo "HEAD OK: $ACTUAL"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
            pip install -c constraints.txt pytest
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run C3B1 Oborovo tax source truth tests
        run: |
          python -m pytest -q tests/test_stage_c3b1_oborovo_tax_source_truth.py

      - name: Report C3B1 test count
        if: always()
        run: |
          python -m pytest --collect-only -q tests/test_stage_c3b1_oborovo_tax_source_truth.py 2>&1 | tail -3
