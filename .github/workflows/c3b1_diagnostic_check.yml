name: C3B1 Oborovo Tax Source Truth

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - stage-c3b1-oborovo-tax-source-truth

concurrency:
  group: c3b1-diagnostic-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  c3b1-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: checked-out commit does not match expected head SHA" >&2
            exit 1
          fi
          echo "HEAD OK: $ACTUAL"

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Set up Python 3.11
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
            pip install -c constraints.txt pytest
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run C3B1 Oborovo tax source truth tests
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q tests/test_stage_c3b1_oborovo_tax_source_truth.py

      - name: Report C3B1 test count
        if: always()
        run: |
          python -m pytest --collect-only -q tests/test_stage_c3b1_oborovo_tax_source_truth.py 2>&1 | tail -3
