name: MVP G2A - Financing Stack and Derived SHL

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: mvp-g2a-financing-stack-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  mvp-g2a-financing-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY"
          echo "All changed files are in UI/template/presentation paths."
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - uses: actions/setup-python@v5
        if: steps.scope.outputs.engine_sensitive == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: G2A financing stack and G0 capacity authority
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q --tb=short \
            tests/test_mvp_g2a_financing_stack.py \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g1_workflow_authority.py

      - name: Changed-file anti-calibration scan
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          git fetch origin main --depth=1
          ! git diff --unified=0 origin/main...HEAD \
            -- financial_engine finco_core app domain \
            | grep -E '^\+[^+]' \
            | grep -Ei \
              'approved_delta|expected_delta|target debt fitting|target cfads fitting|target tax fitting|target shl fitting|source output vector runtime input|balancing plug|forced principal|project\.name|project\.code|baseline_id'
