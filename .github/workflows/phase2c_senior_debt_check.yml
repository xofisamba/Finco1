name: Phase 2C Senior Debt Check

on:
  pull_request:
    branches:
      - phase2b-tax-cfads-core
      - main
  push:
    branches:
      - phase2c-senior-debt-fixed-point

jobs:
  phase2c-senior-debt-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Run Phase 2A tests
        run: |
          python -m pytest tests/test_phase2a_orchestrator.py tests/test_phase2a_engine_inputs.py -v --tb=short

      - name: Run Phase 2B tests
        run: |
          python -m pytest tests/test_phase2b_tax_cfads.py -v --tb=short

      - name: Run Phase 2C tests
        run: |
          python -m pytest tests/test_phase2c_senior_debt.py -v --tb=short

      - name: Run TUHO blocked check (expect exit 9)
        run: |
          python -m finco_parity.check_financial_engine_senior_debt --baseline tuho --check || test $? -eq 9

      - name: Run runnable baselines check
        run: |
          python -m finco_parity.check_financial_engine_senior_debt --baseline oborovo && \
          python -m finco_parity.check_financial_engine_senior_debt --baseline generic_solar && \
          python -m finco_parity.check_financial_engine_senior_debt --baseline generic_wind
