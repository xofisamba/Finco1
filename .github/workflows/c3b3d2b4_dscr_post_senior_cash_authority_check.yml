name: C3B3D2B4 — DSCR Split + Post-Senior Cash Authority (hardened)

on:
  workflow_dispatch:

jobs:
  c3b3d2b4-check:
    name: C3B3D2B4 DSCR split and post-senior cash authority (hardened)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Expected HEAD: ${EXPECTED}"
          echo "Actual   HEAD: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "FAIL: checkout is not the exact PR/push head" >&2
            exit 1
          fi
          echo "PASS: exact-head checkout"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SHA verification — C3B3D2B4 base SHA is ancestor
        run: |
          git merge-base --is-ancestor 8a185411e57bed5b75f4117d1b3bb8bfaf222649 HEAD \
            && echo "PASS: base SHA 8a185411 is ancestor of HEAD"

      - name: Full PR diff check — whitespace
        run: |
          git diff --check \
            8a185411e57bed5b75f4117d1b3bb8bfaf222649..HEAD \
            && echo "PASS: no whitespace errors in PR diff"

      - name: C3B3D2B4 — DSCR split and post-senior cash authority suite
        run: |
          python -m pytest \
            tests/test_stage_c3b3d2b4_dscr_post_senior_cash_authority.py \
            -v --tb=short

      - name: Governance — no project identity in changed production files
        run: |
          python - <<'PY'
          from pathlib import Path

          files = (
              Path("financial_engine/inputs.py"),
              Path("financial_engine/orchestrator.py"),
              Path("financial_engine/results.py"),
              Path("financial_engine/provenance.py"),
              Path("financial_engine/adapters/shl_cash_seam.py"),
          )
          forbidden = ("project.name", "project.code", "baseline_id")
          failures = []
          for path in files:
              text = path.read_text(encoding="utf-8").lower()
              for token in forbidden:
                  if token in text:
                      failures.append(f"{path}: {token}")
          if failures:
              raise SystemExit("FAIL: project identity token(s) in production files: " + "; ".join(failures))
          print("PASS: production files are project-identity-free (calculation dispatch)")
          PY

      - name: Governance — no forbidden abstraction names in financial_engine
        run: |
          for pat in DebtSizingScenario ProductionScenarioScope bank_sizing_scenario _derive_bank_operating_input; do
            if grep -rn "$pat" financial_engine/ --include="*.py"; then
              echo "FAIL: forbidden name '$pat' found in financial_engine"
              exit 1
            fi
          done
          echo "PASS: no forbidden abstraction names"

      - name: Governance — financial_engine does not import finco_recon
        run: |
          if grep -rn "finco_recon" financial_engine/ --include="*.py"; then
            echo "FAIL: financial_engine imports finco_recon"
            exit 1
          fi
          echo "PASS: financial_engine does not import finco_recon"

      - name: Governance — shl_cash_seam does not read bank_cfads_keur
        run: |
          python - <<'PY'
          import ast, inspect, textwrap
          from financial_engine.adapters import shl_cash_seam
          for fn in (shl_cash_seam.compute_shl_cash_from_phase2c,
                     shl_cash_seam._compute_shl_cash_from_post_senior_cash):
              src = textwrap.dedent(inspect.getsource(fn))
              tree = ast.parse(src)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Attribute) and node.attr == "bank_cfads_keur":
                      raise SystemExit(f"FAIL: {fn.__name__} accesses .bank_cfads_keur in code")
          print("PASS: shl_cash_seam never reads bank_cfads_keur in function code")
          PY

      - name: Governance — senior_dscr is a property, not a dataclass field
        run: |
          python - <<'PY'
          import dataclasses
          from financial_engine.results import SeniorDebtSchedules
          fields = {f.name for f in dataclasses.fields(SeniorDebtSchedules)}
          if "senior_dscr" in fields:
              raise SystemExit("FAIL: senior_dscr must be a property, not a dataclass field")
          if "base_dscr" not in fields:
              raise SystemExit("FAIL: base_dscr must be a dataclass field")
          prop = SeniorDebtSchedules.__dict__.get("senior_dscr")
          if not isinstance(prop, property):
              raise SystemExit("FAIL: senior_dscr must be a @property on SeniorDebtSchedules")
          print("PASS: senior_dscr is a compat property; base_dscr is the authoritative field")
          PY

      - name: Governance — serialization contract (asdict includes base_dscr, not senior_dscr)
        run: |
          python - <<'PY'
          import dataclasses
          from financial_engine.results import SeniorDebtSchedules
          dummy = SeniorDebtSchedules(
              period_indices=(1,), senior_debt_opening_keur=(100.0,),
              senior_interest_keur=(5.0,), senior_principal_keur=(10.0,),
              senior_debt_service_keur=(15.0,), senior_debt_closing_keur=(90.0,),
              base_dscr=(1.35,), debt_size_keur=100.0,
              binding_constraint="DSCR", diagnostics={},
          )
          d = dataclasses.asdict(dummy)
          if "base_dscr" not in d:
              raise SystemExit("FAIL: base_dscr not in asdict output")
          if "senior_dscr" in d:
              raise SystemExit("FAIL: senior_dscr must NOT appear in asdict (it is a property)")
          print("PASS: asdict includes base_dscr; senior_dscr property excluded")
          PY

      - name: Governance — CONSTRUCTION_SHL_AVAILABLE_CASH_IS_ZERO_BY_CONTRACT
        run: |
          python - <<'PY'
          from app.project_factories import create_default_tuho_wind1
          from financial_engine.adapters.project_inputs import from_project_inputs
          from financial_engine.inputs import (
              TaxCalculationInput, YieldScenario, DebtSizingCaseInput, SeniorDebtModelInput,
          )
          from financial_engine.orchestrator import run_senior_debt_model
          from financial_engine.senior_debt.policy import SeniorDebtPolicy, SeniorDebtSizingMode, DayCountConvention
          from financial_engine.senior_debt.inputs import SeniorDebtInputs
          from finco_parity.tax_reference_inputs import build_tax_policy, build_opening_loss_vintages

          base_op = from_project_inputs(create_default_tuho_wind1())
          policy = build_tax_policy("tuho")
          vintages = build_opening_loss_vintages("tuho")
          tax_input = TaxCalculationInput(
              policy=policy, opening_loss_vintages=vintages, period_interest=(), period_adjustments=()
          )
          sd_policy = SeniorDebtPolicy(
              policy_id="ci_construction_check", policy_version="1.0",
              sizing_mode=SeniorDebtSizingMode.DSCR_SCULPTED,
              target_dscr=1.2, maximum_gearing=None, annual_fixed_rate=0.05,
              periods_per_year=2, day_count_convention=DayCountConvention.ACT_365,
              repayment_start_period_index=2, maturity_period_index=61,
              convergence_tolerance_keur=1.0, convergence_relative_tolerance=0.001,
              maximum_iterations=300, permit_terminal_balloon=True,
          )
          sd_inputs = SeniorDebtInputs(
              eligible_project_cost_keur=100_000.0, initial_debt_guess_keur=60_000.0,
              period_rates=(), explicit_principal_schedule=None,
          )
          result = run_senior_debt_model(SeniorDebtModelInput(
              operating=base_op, tax=tax_input,
              senior_debt_policy=sd_policy, senior_debt_inputs=sd_inputs,
              debt_sizing_case=DebtSizingCaseInput(
                  production_yield_scenario=YieldScenario.P90_10Y,
                  source_label="ci_construction_check",
              ),
          ))
          psc = result.post_senior_cash
          periods_meta = {p.period_index: p for p in result.periods}
          failures = []
          for idx, avail in zip(psc.period_indices, psc.cash_available_for_shl_before_reserves_keur):
              if periods_meta[idx].is_construction and avail != 0.0:
                  failures.append(f"period {idx}: avail={avail}")
          if failures:
              raise SystemExit("FAIL: construction SHL available cash is not zero: " + "; ".join(failures))
          print("PASS: CONSTRUCTION_SHL_AVAILABLE_CASH_IS_ZERO_BY_CONTRACT")
          PY

      - name: Governance — solver_bank_dscr field present in DebtSizingSchedules
        run: |
          python - <<'PY'
          import dataclasses
          from financial_engine.results import DebtSizingSchedules
          fields = {f.name for f in dataclasses.fields(DebtSizingSchedules)}
          if "solver_bank_dscr" not in fields:
              raise SystemExit("FAIL: solver_bank_dscr must be a dataclass field on DebtSizingSchedules")
          if "bank_sizing_dscr" not in fields:
              raise SystemExit("FAIL: bank_sizing_dscr must be a dataclass field on DebtSizingSchedules")
          print("PASS: solver_bank_dscr and bank_sizing_dscr are fields on DebtSizingSchedules")
          PY

      - name: C3B3D2B4.2 — Solver handshake + fixture acceptance + Groups O–Z suite
        run: |
          python -m pytest \
            tests/test_stage_c3b3d2b4_dscr_post_senior_cash_authority.py \
            -k "TestO_ or TestP_ or TestQ_ or TestR_ or TestS_ or TestT_ or TestU_ or TestV_ or TestW_ or TestX_ or TestY_ or TestZ_" \
            -v --tb=short

      - name: SHL production wiring regression
        run: |
          python -m pytest tests/test_stage_c3b3d2b1_shl_production_wiring.py \
            -v --tb=short

      - name: C3B3D2B3 — debt sizing case production regression (hardened)
        run: |
          python -m pytest \
            tests/test_stage_c3b3d2b3_debt_sizing_case_production.py \
            tests/test_stage_c3b3d2b3_hardening_completion.py \
            -v --tb=short

      - name: C3B3D2B2C — bank-sizing CFADS evidence-only suite
        run: |
          python -m pytest tests/test_stage_c3b3d2b2c_bank_sizing_cfads_production.py \
            -v --tb=short

      - name: C3B3A — clean senior debt source contract regression
        run: |
          python -m pytest tests/test_stage_c3b3a_clean_senior_debt_source_contract.py \
            -v --tb=short

      - name: Phase 2C — senior debt regression
        run: |
          python -m pytest tests/test_phase2c_senior_debt.py \
            -v --tb=short

      - name: Phase 2B — tax and CFADS regression
        run: |
          python -m pytest tests/test_phase2b_tax_cfads.py \
            -v --tb=short \
            --deselect tests/test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[oborovo]

      - name: C3B1 — tax source truth regression
        run: |
          python -m pytest tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            -v --tb=short

      - name: CI failure classification summary
        run: |
          echo "=== C3B3D2B4 CI FAILURE CLASSIFICATION ==="
          echo "PRE_EXISTING (deselected): test_phase2b_tax_cfads.py::test_w_correction_aware_four_baseline[oborovo]"
          echo "SUPERSEDED: C3B3D2B2B/C3B3D2B2C zero-diff diagnostic expectations"
          echo "Any failure in the required steps above is INTRODUCED_BY_OR_RELEVANT_TO_C3B3D2B4 and blocks this workflow."
          echo "========================================"
