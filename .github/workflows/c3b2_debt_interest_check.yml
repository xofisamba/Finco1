name: C3B2 Debt Interest Check

on:
  push:
    branches:
      - stage-c3b2-oborovo-debt-interest-source-closure
      - main
    paths:
      - finco_recon/extract_oborovo_debt_interest.py
      - tests/fixtures/excel_oborovo_debt_interest_truth.json
      - tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py
      - docs/reconciliation/oborovo_debt_interest_source_closure.md
      - .github/workflows/c3b2_debt_interest_check.yml
  pull_request:
    branches:
      - main
    paths:
      - finco_recon/extract_oborovo_debt_interest.py
      - tests/fixtures/excel_oborovo_debt_interest_truth.json
      - tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py
      - docs/reconciliation/oborovo_debt_interest_source_closure.md
      - .github/workflows/c3b2_debt_interest_check.yml

jobs:
  c3b2-tests:
    name: C3B2 debt interest source closure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install pytest openpyxl

      - name: Run C3B2 tests
        run: |
          python -m pytest tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py \
            -v \
            --tb=short \
            -q

      - name: Verify extractor version
        run: |
          python -c "
          from finco_recon.extract_oborovo_debt_interest import _EXTRACTOR_VERSION
          assert _EXTRACTOR_VERSION == '1.0.0', f'Expected 1.0.0, got {_EXTRACTOR_VERSION}'
          print(f'Extractor version OK: {_EXTRACTOR_VERSION}')
          "

      - name: Verify fixture verdict
        run: |
          python -c "
          import json, pathlib
          truth = json.loads(pathlib.Path('tests/fixtures/excel_oborovo_debt_interest_truth.json').read_text())
          verdict = truth['equal_input_equal_policy']['verdict']
          valid = {
            'C3B2_EQUAL_INPUT_EQUAL_POLICY_MATCH',
            'C3B2_INPUT_OR_POLICY_MISMATCH_FULLY_EXPLAINED',
            'C3B2_EQUAL_INPUT_EQUAL_POLICY_DIVERGENCE_PROVED',
            'C3B2_SOURCE_TRUTH_PARTIAL_MANUAL_CHECK_REQUIRED',
          }
          assert verdict in valid, f'Unknown verdict: {verdict}'
          print(f'Fixture verdict OK: {verdict}')
          "
