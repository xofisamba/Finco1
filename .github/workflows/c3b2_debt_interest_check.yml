name: C3B2 Debt Interest Check

on:
  push:
    branches:
      - stage-c3b2-oborovo-debt-interest-source-closure
      - claude/festive-cerf-uaq5hb
      - main
    paths:
      - finco_recon/extract_oborovo_debt_interest.py
      - tests/fixtures/excel_oborovo_debt_interest_truth.json
      - tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py
      - docs/reconciliation/oborovo_debt_interest_source_closure.md
      - .github/workflows/c3b2_debt_interest_check.yml
  pull_request:
    branches:
      - main
    paths:
      - finco_recon/extract_oborovo_debt_interest.py
      - tests/fixtures/excel_oborovo_debt_interest_truth.json
      - tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py
      - docs/reconciliation/oborovo_debt_interest_source_closure.md
      - .github/workflows/c3b2_debt_interest_check.yml

jobs:
  c3b2-tests:
    name: C3B2 debt interest source closure
    runs-on: ubuntu-latest

    steps:
      - name: Resolve exact head SHA
        id: expected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.expected.outputs.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ steps.expected.outputs.sha }}"
          echo "Expected SHA: ${EXPECTED}"
          echo "Actual   SHA: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: checked out SHA does not match expected"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
          elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e .
          fi
          # Ensure required packages are present
          pip install pytest openpyxl python-dateutil

      - name: Report HEAD SHA
        run: |
          echo "HEAD SHA: $(git rev-parse HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD || echo detached)"

      - name: Run C3B2 tests
        run: |
          python -m pytest tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py \
            -v \
            --tb=short

      - name: Report exact test count
        run: |
          COUNT=$(python -m pytest tests/test_stage_c3b2_oborovo_debt_interest_source_closure.py \
            --collect-only -q 2>&1 | grep -E '^[0-9]+ test' | awk '{print $1}')
          echo "Tests collected: ${COUNT}"
          if [ "${COUNT}" -lt 80 ]; then
            echo "ERROR: Expected >= 80 tests, found ${COUNT}"
            exit 1
          fi

      - name: Verify extractor version
        run: |
          python -c "
          from finco_recon.extract_oborovo_debt_interest import _EXTRACTOR_VERSION
          assert _EXTRACTOR_VERSION == '2.0.0', f'Expected 2.0.0, got {_EXTRACTOR_VERSION}'
          print(f'Extractor version OK: {_EXTRACTOR_VERSION}')
          "

      - name: Verify extractor uses solve_senior_debt
        run: |
          python -c "
          import inspect
          from finco_recon import extract_oborovo_debt_interest as m
          src = inspect.getsource(m)
          assert 'solve_senior_debt' in src, 'Extractor must use solve_senior_debt'
          assert 'build_schedule' not in src, 'Extractor must not use build_schedule'
          print('Extractor API: OK (uses solve_senior_debt, not build_schedule)')
          "

      - name: Verify fixture structure
        run: |
          python -c "
          import json, pathlib
          truth = json.loads(pathlib.Path('tests/fixtures/excel_oborovo_debt_interest_truth.json').read_text())
          sa = truth['phase2c_sizing_analysis']
          assert sa['status'] == 'COMPUTED', f'status={sa[\"status\"]}'
          assert 'current_phase2c_solver_result' in sa, 'missing current_phase2c_solver_result'
          assert 'scalar_excel_matched_solver_result' in sa, 'missing scalar_excel_matched_solver_result'
          assert 'independent_vector_dscr_capacity' in sa, 'missing independent_vector_dscr_capacity'
          assert 'causal_bridge' in sa, 'missing causal_bridge'
          verdict = sa['verdict']
          valid = {
            'C3B2_EQUAL_INPUT_EQUAL_POLICY_MATCH',
            'C3B2_INPUT_OR_POLICY_MISMATCH_FULLY_EXPLAINED',
            'C3B2_EQUAL_INPUT_EQUAL_POLICY_DIVERGENCE_PROVED',
            'C3B2_SOURCE_TRUTH_PARTIAL_MANUAL_CHECK_REQUIRED',
          }
          assert verdict in valid, f'Unknown verdict: {verdict}'
          print(f'Fixture structure OK: verdict={verdict}')
          "

      - name: Verify causal bridge closes
        run: |
          python -c "
          import json, pathlib
          truth = json.loads(pathlib.Path('tests/fixtures/excel_oborovo_debt_interest_truth.json').read_text())
          bridge = truth['phase2c_sizing_analysis']['causal_bridge']
          assert bridge['bridge_closed'] is True, f'bridge_closed=False; error={bridge[\"bridge_closure_error_keur\"]}'
          err = bridge['bridge_closure_error_keur']
          assert err < 1.0, f'Bridge closure error {err:.6f} kEUR > 1 kEUR tolerance'
          print(f'Causal bridge OK: closure_error={err:.9f} kEUR')
          "

      - name: Verify independent backward induction
        run: |
          python -c "
          import json, pathlib
          truth = json.loads(pathlib.Path('tests/fixtures/excel_oborovo_debt_interest_truth.json').read_text())
          ivd = truth['phase2c_sizing_analysis']['independent_vector_dscr_capacity']
          delta = abs(ivd['delta_keur'])
          assert delta < 0.001, f'Independent induction delta {delta:.12f} kEUR must be < 0.001'
          print(f'Independent backward induction OK: delta={delta:.12f} kEUR')
          "

      - name: Verify no MANUAL_EXPLORATION placeholders
        run: |
          python -c "
          import json, pathlib
          text = pathlib.Path('tests/fixtures/excel_oborovo_debt_interest_truth.json').read_text()
          assert 'MANUAL_EXPLORATION' not in text, 'Fixture contains MANUAL_EXPLORATION placeholder'
          print('No MANUAL_EXPLORATION placeholders found')
          "

      - name: Verify production paths untouched
        run: |
          BASE_SHA="1fb4943a4319eff8f4ac7a22add6f65f14bd8cec"
          CHANGED=$(git diff "${BASE_SHA}...HEAD" --name-only 2>/dev/null || git diff HEAD~1 --name-only)
          echo "Changed files:"
          echo "${CHANGED}"
          FORBIDDEN=$(echo "${CHANGED}" | grep -E '^(financial_engine/|app/|finco_core/)' || true)
          if [ -n "${FORBIDDEN}" ]; then
            echo "ERROR: Production paths modified:"
            echo "${FORBIDDEN}"
            exit 1
          fi
          echo "Production paths untouched: OK"

      - name: C3B1 regression check
        run: |
          python -m pytest tests/test_stage_c3b1_oborovo_tax_source_truth.py \
            -v --tb=short -q
          echo "C3B1 regression: PASSED"
