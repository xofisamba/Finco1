name: Pre-freeze PR-8 Single Production Financial Authority Check

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "finco_core/**"
      - "domain/**"
      - "app/api/project_runner.py"
      - "app/services/production_financial_authority.py"
      - "app/services/production_waterfall_seam.py"
      - "app/project_factories.py"
      - "constraints.txt"
      - "tests/test_prefreeze_pr8_single_production_financial_authority.py"
      - ".github/workflows/prefreeze_pr8_single_production_financial_authority_check.yml"
  push:
    branches: [main]

concurrency:
  group: prefreeze-pr8-single-production-financial-authority-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  single-production-financial-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "PR8_HEAD_SHA_MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          }

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Assert ancestry from verified PR-7 main
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          BASE="0fa2ec3de4ca0a1ada491b97d72aef23bb1c72d1"
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "PR8_BASE_ANCESTRY_MISSING: $BASE is not an ancestor of HEAD"
            exit 1
          }

      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Whitespace and diff hygiene
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          git diff --check
          git status --short

      - name: Production-governance scan of added Python lines
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          added_python="$({
            git diff --unified=0 origin/main...HEAD -- app domain financial_engine finco_core \
              | grep -E '^\+[^+]' || true
          })"
          if [[ -n "$added_python" ]]; then
            ! grep -nEi \
              'approved_delta|expected_delta|balancing[_ ]plug|terminal[_ -]top[- ]up|forced principal|target fitting|post-engine mutation|bank_balancing_cost' \
              <<< "$added_python"
          fi

      - name: PR-8 production-authority tests
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr8_single_production_financial_authority.py

      - name: PR-7 regressions (Base/Bank authority retained)
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr7_typed_base_bank_case_authority.py \
            tests/test_stage_c3b3d2b3_debt_sizing_case_production.py

      - name: Generic Solar/Wind clean-chain and Oborovo source truth
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_stage_c3b3d2b7_bank_case_senior_parity.py \
            tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py

      - name: TUHO readiness and KUPI diagnostic
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_kupi_k0_k3_causal_grid.py

      - name: PR-5 and PR-6 regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr5_canonical_ebitda_authority.py \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py

      - name: B5-B8 senior/SHL integration regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py \
            tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py

      - name: G0-G2C authority regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_g1_workflow_authority.py \
            tests/test_mvp_g2a_financing_stack.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py

      - name: C3B3A clean senior debt contract and Phase 2C orchestrator
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_stage_c3b3a_clean_senior_debt_source_contract.py \
            tests/test_phase2c_senior_debt.py
