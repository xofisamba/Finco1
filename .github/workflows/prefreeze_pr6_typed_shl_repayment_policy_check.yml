name: Pre-freeze PR-6 Typed SHL Repayment Policy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: prefreeze-pr6-typed-shl-repayment-policy-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  typed-shl-repayment-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "PR6_HEAD_SHA_MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          }

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_SAFE_UI_ONLY"
          echo "All changed files are in UI/template/presentation paths."
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Diff and production-governance checks
        if: steps.scope.outputs.engine_sensitive == 'true'
        shell: bash
        run: |
          changed_python_diff="$(
            git diff --unified=0 origin/main...HEAD \
              -- app domain financial_engine finco_core \
            | grep -E '^\+[^+]' || true
          )"
          if [[ -n "$changed_python_diff" ]]; then
            ! grep -nEi \
              'approved_delta|expected_delta|balancing[_ ]plug|terminal[_ -]top[- ]up|forced principal|target fitting|post-engine mutation' \
              <<< "$changed_python_diff"
            ! grep -nE \
              'project\.(name|code)|baseline_id' \
              <<< "$changed_python_diff"
          fi
          ! grep -RFn 'prefreeze_pr6_shl_repayment_source_lock.json' \
            app domain financial_engine finco_core

      - name: PR-6 focused source and production acceptance
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py \
            tests/test_kupi_k0_k3_causal_grid.py

      - name: G0-G2 authority regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g1_workflow_authority.py \
            tests/test_mvp_g2a_financing_stack.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py

      - name: B6-B8 and source-tax regressions
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest -q \
            tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py \
            tests/test_stage_c3b3d2b7_bank_case_senior_parity.py \
            tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py \
            tests/test_stage_c3b1_oborovo_tax_source_truth.py
