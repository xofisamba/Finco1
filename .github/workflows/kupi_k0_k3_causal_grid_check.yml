name: KUPI K0-K3 Causal Grid Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - prefreeze-kupi-k0-k3-causal-grid
      - claude/festive-cerf-uaq5hb

jobs:
  kupi-k0-k3-causal-grid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: checked-out commit does not match expected head SHA" >&2
            exit 1
          fi
          echo "HEAD OK: $ACTUAL"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
            pip install -c constraints.txt pytest
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run KUPI K0-K3 causal grid tests
        run: |
          python -m pytest -q tests/test_kupi_k0_k3_causal_grid.py -v

      - name: Report KUPI K0-K3 test count
        if: always()
        run: |
          python -m pytest --collect-only -q tests/test_kupi_k0_k3_causal_grid.py 2>&1 | tail -5

      - name: Governance guard — no source Senior injected
        run: |
          python -c "
          import ast, sys, pathlib
          src = pathlib.Path('tests/diagnostics/kupi_k0_k3_causal_grid.py').read_text()
          forbidden = ['147150', '147_150', '68_152', '68152']
          violations = [f for f in forbidden if f in src.replace('SOURCE_SENIOR_KEUR', '').replace('SOURCE_SHL_PRINCIPAL_KEUR', '')]
          if violations:
              print('GOVERNANCE VIOLATION: forbidden literal found:', violations)
              sys.exit(1)
          print('Governance guard passed: no forbidden literals injected as inputs.')
          "

      - name: Governance guard — no project identity dispatch
        run: |
          python -c "
          import re, sys, pathlib
          pattern = re.compile(r'(if|elif)\s+.*\b(kupi|tuho|oborovo|krnovo)\b', re.IGNORECASE)
          engine_root = pathlib.Path('financial_engine')
          violations = []
          for f in engine_root.rglob('*.py'):
              if '__pycache__' in str(f):
                  continue
              for i, line in enumerate(f.read_text().splitlines(), 1):
                  if pattern.search(line):
                      violations.append(f'{f}:{i}: {line.strip()}')
          if violations:
              print('GOVERNANCE VIOLATION: project dispatch found:')
              print('\n'.join(violations))
              sys.exit(1)
          print('Governance guard passed: no project identity dispatch.')
          "
