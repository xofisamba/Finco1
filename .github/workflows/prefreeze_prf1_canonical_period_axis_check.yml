name: Pre-freeze PR-F1 Canonical Period Axis Check

on:
  push:
    branches:
      - prefreeze-prf1-canonical-period-axis
  pull_request:
    branches:
      - main
    paths:
      - "finco_core/engine/period_engine.py"
      - "financial_engine/**"
      - "app/services/clean_presentation_adapter.py"
      - "tests/test_prefreeze_prf1_canonical_period_axis.py"
      - "tests/test_period_engine.py"
      - "tests/test_period_day_fractions.py"
      - "tests/test_phase2c_senior_debt.py"
      - "tests/test_stage_c3b3d2b3_hardening_completion.py"
      - "tests/test_stage_c3b3d2b3_debt_sizing_case_production.py"
      - "tests/test_stage_c3b3d2b4_dscr_post_senior_cash_authority.py"
      - ".github/workflows/prefreeze_prf1_canonical_period_axis_check.yml"

jobs:
  canonical-period-axis:
    name: PR-F1 Canonical Period Axis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head SHA
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Assert exact freeze ancestry
        run: git merge-base --is-ancestor a3a495ac418cece94847a7762e4b742787a3f352 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -e .
            pip install -c constraints.txt pytest
          else
            pip install -e .
            pip install pytest
          fi

      - name: Diff hygiene
        run: git diff --check a3a495ac418cece94847a7762e4b742787a3f352..HEAD

      - name: Canonical axis and production adapters
        run: |
          python -m pytest -q --tb=short \
            tests/test_prefreeze_prf1_canonical_period_axis.py \
            tests/test_period_engine.py \
            tests/test_period_day_fractions.py \
            tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py

      - name: Clean financing and downstream ring
        run: |
          python -m pytest -q --tb=short \
            tests/test_mvp_g0_generic_clean_engine_enablement.py \
            tests/test_mvp_g1_governance_methodology_lock.py \
            tests/test_mvp_g1_workflow_authority.py \
            tests/test_mvp_g2a_financing_stack.py \
            tests/test_mvp_g2b_sponsor_returns.py \
            tests/test_mvp_g2c_shareholder_waterfall.py \
            tests/test_prefreeze_pr5_canonical_ebitda_authority.py \
            tests/test_prefreeze_pr6_typed_shl_repayment_policy.py \
            tests/test_prefreeze_pr7_typed_base_bank_case_authority.py \
            tests/test_prefreeze_pr8_single_production_financial_authority.py \
            tests/test_pr9_typed_construction_idc_authority.py \
            tests/test_prefreeze_pr10_typed_country_tax_authority.py

      - name: Senior debt and cash-authority regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_stage_c3b3d2b3_hardening_completion.py \
            tests/test_stage_c3b3d2b3_debt_sizing_case_production.py \
            tests/test_stage_c3b3d2b4_dscr_post_senior_cash_authority.py \
            tests/test_stage_c3b3d2b5_shl_fixed_point_integration.py \
            tests/test_stage_c3b3d2b6_base_post_senior_cash_parity.py \
            tests/test_stage_c3b3d2b7_bank_case_senior_parity.py \
            tests/test_stage_c3b3d2b8_base_senior_shl_parity_closure.py \
            tests/test_stage_c3b3a_clean_senior_debt_source_contract.py

      - name: Governance scan
        shell: bash
        run: |
          mapfile -t changed_python < <(
            git diff --name-only \
              a3a495ac418cece94847a7762e4b742787a3f352...HEAD \
              -- app domain finco_core financial_engine \
            | grep -E '\.py$' || true
          )
          if ((${#changed_python[@]})); then
            ! grep -nHEi \
              'project\.name|project\.code|baseline_id|approved_delta|expected_delta|balancing[_ ]plug|source[_ ]output[_ ]vector|terminal[_ ]top[_ ]up|virtual[_ ]debt' \
              "${changed_python[@]}"
          fi
