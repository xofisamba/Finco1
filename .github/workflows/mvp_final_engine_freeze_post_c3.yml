name: MVP Final Engine Freeze — Post-C3

on:
  push:
    branches:
      - main
      - mvp-final-engine-freeze-post-c3
  pull_request:
    branches:
      - main
    paths:
      - 'tests/test_mvp_final_engine_freeze_post_c3.py'
      - 'docs/architecture/MVP_ENGINE_FREEZE_POST_C3.md'
      - 'financial_engine/**'
      - 'finco_core/**'
      - 'app/**'
      - 'domain/**'
      - '.github/workflows/mvp_final_engine_freeze_post_c3.yml'

# Cancel any in-progress run on the same PR/ref when a newer commit is pushed.
# This prevents an obsolete 67-minute freeze run from blocking a newer commit.
concurrency:
  group: mvp-final-engine-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  freeze-baseline:
    name: Four-project engine freeze baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: §2–§11 Full freeze suite (single process — session cache active)
        run: |
          python3 -m pytest -q --tb=short \
            --basetemp=.pytest-tmp-final-engine-freeze \
            tests/test_mvp_final_engine_freeze_post_c3.py
