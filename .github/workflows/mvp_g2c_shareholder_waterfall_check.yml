name: MVP G2C - Covenant-Gated Shareholder Waterfall

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "finco_core/**"
      - "domain/**"
      - "app/api/project_runner.py"
      - "app/services/production_financial_authority.py"
      - "app/services/production_waterfall_seam.py"
      - "app/project_factories.py"
      - "constraints.txt"
      - "tests/test_mvp_g2c_shareholder_waterfall.py"
      - ".github/workflows/mvp_g2c_shareholder_waterfall_check.yml"
  push:
    branches: [main]

concurrency:
  group: mvp-g2c-shareholder-waterfall-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  g2c-shareholder-waterfall:
    name: mvp-g2c-shareholder-waterfall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact-head checkout
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "G2C_HEAD_SHA_MISMATCH: expected=$EXPECTED actual=$ACTUAL"
            exit 1
          fi
          echo "Checked out $ACTUAL"

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          python3 .github/scripts/classify_ci_scope.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE
        if: steps.scope.outputs.engine_sensitive != 'true'
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            SCOPE="UI_ONLY"
          elif [ "${{ steps.scope.outputs.docs_only }}" = "true" ]; then
            SCOPE="DOCS_ONLY"
          elif [ "${{ steps.scope.outputs.workflow_only }}" = "true" ]; then
            SCOPE="WORKFLOW_ONLY"
          else
            SCOPE="NON_ENGINE"
          fi
          echo "======================================================"
          echo "ENGINE_REGRESSION_SKIPPED_NON_ENGINE_SCOPE"
          echo "Actual scope: $SCOPE"
          echo "No financial engine authority regression required."
          echo "Frozen authority diff: ZERO (verified by classifier)."
          echo "Full engine regression: available via nightly / workflow_dispatch."
          echo "======================================================"


      - name: Set up Python
        if: steps.scope.outputs.engine_sensitive == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Governance — G2C contracts contain no target-fitting architectural fields
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -c "
          import dataclasses
          from financial_engine.shareholder_waterfall.contracts import CovenantGatedWaterfallResult
          names = {f.name for f in dataclasses.fields(CovenantGatedWaterfallResult)}
          forbidden = {
              'balancing_account', 'balancing_plug', 'target_irr', 'terminal_top_up',
              'period_correction', 'approved_delta', 'expected_delta',
          }
          found = names & forbidden
          assert not found, f'G2C contract has forbidden fields: {found}'
          print('G2C contract clean')
          "

      - name: Portability — no agent-local absolute paths in G2C production files
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          # Scan only production source files. Test files contain literal strings
          # in assertions (e.g. assert "/home/user/Finco1" not in text) which would
          # self-match — they are not actual hardcoded paths.
          if grep -rn --include="*.py" "/home/user/Finco1\|/home/runner/work\|/Users/" \
               financial_engine/shareholder_waterfall/ \
               financial_engine/financing/dsrf.py; then
            echo "G2C_ABSOLUTE_PATH_FOUND: agent-local path detected in G2C production files"
            exit 1
          fi
          echo "No agent-local absolute paths found in production files"

      - name: Governance — no target-fitting tokens in G2C
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          grep -rn "approved_delta\|expected_delta\|balancing_plug\|target_irr\|target_moic\|terminal_top_up\|period_correction" \
            financial_engine/shareholder_waterfall/ \
            && echo "FORBIDDEN_TOKEN_FOUND" && exit 1 \
            || echo "No target-fitting tokens found"

      - name: Governance — no project-identity dispatch in G2C
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -c "
          import ast, pathlib
          forbidden = {'oborovo', 'solar', 'wind', 'tuho'}
          for fpath in pathlib.Path('financial_engine/shareholder_waterfall').rglob('*.py'):
              tree = ast.parse(fpath.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      if node.value.lower() in forbidden:
                          raise AssertionError(f'Project-identity dispatch in {fpath}: {node.value!r}')
          print('No project-identity dispatch found')
          "

      - name: Governance — distribution_lockup_dscr distinct from target_dscr
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -c "
          from app.project_factories import create_default_solar_project
          solar = create_default_solar_project()
          assert solar.financing.target_dscr != solar.financing.lockup_dscr, (
              f'target_dscr ({solar.financing.target_dscr}) must differ from '
              f'lockup_dscr ({solar.financing.lockup_dscr})'
          )
          print(f'target_dscr={solar.financing.target_dscr}, lockup_dscr={solar.financing.lockup_dscr} — distinct')
          "

      - name: Source authority — Oborovo lockup_dscr fixture value
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -c "
          import json
          d = json.loads(open('tests/fixtures/excel_oborovo_financial_truth.json').read())
          entry = d['inputs']['senior_lockup_dscr']
          assert entry['row'] == 223 and entry['col'] == 'D'
          assert abs(entry['value'] - 1.10) < 1e-9, f'senior_lockup_dscr != 1.10: {entry[\"value\"]}'
          print(f'Oborovo Inputs!D223 senior_lockup_dscr = {entry[\"value\"]} confirmed')
          "

      - name: G2A upstream invariants preserved
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -c "
          from app.project_factories import create_default_solar_project, create_default_wind_project
          from financial_engine.shareholder_waterfall import run_project_shareholder_waterfall_model
          solar = run_project_shareholder_waterfall_model(create_default_solar_project())
          wind  = run_project_shareholder_waterfall_model(create_default_wind_project())
          fin_s = solar.financing_result
          fin_w = wind.financing_result
          assert abs(fin_s.project_uses.total_project_uses_keur - 33000.0) < 1e-6
          assert abs(fin_s.final_senior_commitment_keur - 24750.0) < 1e-6
          assert abs(fin_s.derived_shl_cash_principal_keur - 7750.0) < 1e-6
          assert abs(fin_w.project_uses.total_project_uses_keur - 43000.0) < 1e-6
          assert abs(fin_w.final_senior_commitment_keur - 32250.0) < 1e-6
          assert abs(fin_w.derived_shl_cash_principal_keur - 10250.0) < 1e-6
          assert solar.periods_locked_by_dscr == 0
          assert wind.periods_locked_by_dscr == 0
          print('G2A fingerprints and covenant gate status verified')
          "

      - name: MVP G2C focused test suite
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest tests/test_mvp_g2c_shareholder_waterfall.py \
                           tests/test_mvp_dsrf_reserve_support.py -v --tb=short

      - name: G2B authority regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest tests/test_mvp_g2b_sponsor_returns.py -v --tb=short

      - name: G2A authority regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest tests/test_mvp_g2a_financing_stack.py -v --tb=short

      - name: G0 and G1 authority regression
        if: steps.scope.outputs.engine_sensitive == 'true'
        run: |
          python -m pytest tests/test_mvp_g0_generic_clean_engine_enablement.py \
                           tests/test_mvp_g1_workflow_authority.py -v --tb=short
