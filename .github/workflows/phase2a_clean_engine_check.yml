name: Phase 2A Clean Engine Check

# Phase 2A — Clean operating-core parity enforcement.
#
# Enforces zero-tolerance OPERATING_CORE_V1 parity for all four baselines
# (tuho, oborovo, generic_solar, generic_wind). Also verifies:
#   1. Baseline snapshots are unchanged from the committed versions.
#   2. Protected production files (waterfall_core, waterfall_runner,
#      finco_core/waterfall/waterfall_engine) are unmodified.
#   3. Phase 2A unit tests pass.
#   4. Four-baseline OPERATING_CORE_V1 CLI passes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase2a-clean-engine:
    name: Phase 2A Clean Engine (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (reproducible via constraints.txt)
        run: |
          pip install --no-cache-dir -c constraints.txt numpy==1.26.4 pandas==2.2.3
          pip install --no-cache-dir -c constraints.txt -e .
          pip install --no-cache-dir -c constraints.txt pytest

      - name: Check baseline snapshots are unchanged
        run: |
          git diff --name-only origin/main...HEAD -- finco_parity/baselines/snapshots/ > /tmp/snapshot_diff.txt
          if [ -s /tmp/snapshot_diff.txt ]; then
            echo "ERROR: Baseline snapshot files were modified:" >&2
            cat /tmp/snapshot_diff.txt >&2
            exit 1
          fi
          echo "Baseline snapshots: unchanged"

      - name: Check protected production files are unchanged
        run: |
          protected=(
            app/waterfall_core.py
            app/waterfall_runner.py
            finco_core/waterfall/waterfall_engine.py
          )
          changed=0
          for f in "${protected[@]}"; do
            if ! git diff --quiet origin/main...HEAD -- "$f"; then
              echo "ERROR: Protected file was modified: $f" >&2
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then exit 1; fi
          echo "Protected production files: unchanged"

      - name: Verify baselines generate cleanly (generate_baselines --check)
        run: |
          python3 -m finco_parity.generate_baselines --check --quiet

      - name: Run Phase 2A unit tests
        run: |
          python3 -m pytest -q --tb=short \
            tests/test_phase2a_engine_inputs.py \
            tests/test_phase2a_orchestrator.py \
            tests/test_phase2a_production_isolation.py

      - name: Four-baseline OPERATING_CORE_V1 CLI check
        run: |
          python3 -m finco_parity.check_financial_engine_operating_core --all --check
