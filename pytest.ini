[pytest]
markers =
    legacy_excel: Legacy Excel calibration diagnostic tests — not production engine acceptance tests
    engine: Core financial engine unit tests (depreciation, tax, SHL, debt, waterfall, LCF)
    parity: Golden parity tests against Excel fixtures (TUHO/Oborovo stack baselines)
    browser: Browser/Playwright integration tests — requires playwright and chromium
    legacy: Legacy/disabled tests — skipped by conftest or in-file skip; retained for historical reference
    characterization: Phase-era characterization tests pinning implementation snapshots
    historical_compatibility: Superseded source/baseline comparisons retained as non-blocking evidence
    runtime: Runtime audit and fixture validation (R35, R67, R99, construction schedule)
    integration: End-to-end integration tests requiring full app stack
asyncio_mode = auto

# Quick test profiles (use with -m flag):
#   pytest -m engine          Run core engine tests only (~150 files, ~1500 tests)
#   pytest -m parity          Run golden parity tests only (~21 files, ~578 tests)
#   pytest -m "not browser"   Run everything except Playwright tests
#   pytest -m "engine or parity"   Fast CI-equivalent local run
